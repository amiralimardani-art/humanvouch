version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # One entry per contract crate: there is no Cargo workspace manifest yet.
  # Once packages/contracts/Cargo.toml exists, replace this list with "/packages/contracts".
  - package-ecosystem: cargo
    directories:
      - /packages/contracts/attest
      - /packages/contracts/groth16-verifier
      - /packages/contracts/circom-to-soroban-hex
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
